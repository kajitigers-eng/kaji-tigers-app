<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky test</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-3">
<h1 class="text-sm font-bold mb-2">TEST A: current markup (thead sticky + th sticky, border-separate, max-h 72vh overflow-auto)</h1>
<div class="max-h-[72vh] overflow-auto relative border border-slate-200 bg-white" id="boxA">
<table class="w-full text-left border-separate border-spacing-0 min-w-[780px]">
<thead class="sticky top-0 z-30"><tr>
<th class="sticky top-0 left-0 z-40 bg-slate-200 text-slate-800 text-xs font-black py-3 px-2 text-center w-20 min-w-[85px] max-w-[85px] border-b-2 border-r-2 border-slate-300">日程</th>
<th class="sticky top-0 z-30 bg-blue-100 text-blue-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Aチーム</th>
<th class="sticky top-0 z-30 bg-emerald-100 text-emerald-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Bチーム</th>
<th class="sticky top-0 z-30 bg-amber-100 text-amber-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Cチーム</th>
<th class="sticky top-0 z-30 bg-rose-100 text-rose-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">低学年</th>
<th class="sticky top-0 z-30 bg-purple-100 text-purple-950 text-xs font-black py-3 px-2 text-center border-b-2 border-slate-300 min-w-[140px]">全体共通</th>
</tr></thead>
<tbody class="text-xs" id="tbodyA"></tbody>
</table></div>
<h1 class="text-sm font-bold mt-6 mb-2">TEST B: th sticky only, no thead sticky, border-collapse</h1>
<div class="max-h-[72vh] overflow-auto relative border border-slate-200 bg-white" id="boxB">
<table class="w-full text-left border-collapse min-w-[780px]">
<thead><tr>
<th class="sticky top-0 left-0 z-40 bg-slate-200 text-slate-800 text-xs font-black py-3 px-2 text-center w-20 min-w-[85px] max-w-[85px] border-b-2 border-r-2 border-slate-300">日程</th>
<th class="sticky top-0 z-30 bg-blue-100 text-blue-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Aチーム</th>
<th class="sticky top-0 z-30 bg-emerald-100 text-emerald-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Bチーム</th>
<th class="sticky top-0 z-30 bg-amber-100 text-amber-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">Cチーム</th>
<th class="sticky top-0 z-30 bg-rose-100 text-rose-950 text-xs font-black py-3 px-2 text-center border-b-2 border-r border-slate-300 min-w-[135px]">低学年</th>
<th class="sticky top-0 z-30 bg-purple-100 text-purple-950 text-xs font-black py-3 px-2 text-center border-b-2 border-slate-300 min-w-[140px]">全体共通</th>
</tr></thead>
<tbody class="text-xs" id="tbodyB"></tbody>
</table></div>
<div style="height:120vh"></div>
<script>
function fill(id){
  var tb=document.getElementById(id); var h='';
  for(var d=1; d<=25; d++){
    h+='<tr><td class="sticky left-0 z-20 bg-slate-100 text-center font-bold border-b border-r-2 border-slate-300 py-3 px-2 min-w-[85px]">11/'+d+'</td><td class="p-2 border-b border-r border-slate-200">練習 9:00</td><td class="p-2 border-b border-r border-slate-200">練習 9:00</td><td class="p-2 border-b border-r border-slate-200">-</td><td class="p-2 border-b border-r border-slate-200">-</td><td class="p-2 border-b border-slate-200">-</td></tr>';
  }
  tb.innerHTML=h;
}
fill('tbodyA'); fill('tbodyB');
</script>
</body></html>
